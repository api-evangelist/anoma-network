name: Anoma Network

image: https://anoma.net/images/opengraph-v5.jpg

description: Anoma Network is a decentralized operating system that enables developers to build, deploy, and manage applications across multiple
  blockchain networks. It abstracts away blockchain complexity, offering private, easy-to-use tools and SDKs for creating interoperable, sovereign
  applications. Anoma aims to empower a new generation of decentralized services with flexible, secure, and scalable infrastructure.

